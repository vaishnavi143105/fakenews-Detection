<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Check News</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background: linear-gradient(
        135deg,
        #ff24e5,
        #8b5cf6
    );
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.container{
    width:1200px;
    height:90vh;
    background:#07d2f6e6;
    border-radius:15px;
    display:flex;
    flex-direction:column;
    overflow:hidden;
}

.header{
    background:#202123;
    color:white;
    text-align:center;
    padding:18px;
    font-size:24px;
    font-weight:bold;
}

.chat-box{
    flex:1;
    padding:20px;
    overflow-y:auto;
}

.message{
    margin-bottom:15px;
    display:flex;
}

.bot{
    justify-content:flex-start;
}

.user{
    justify-content:flex-end;
}

.bubble{
    max-width:70%;
    padding:12px 15px;
    border-radius:15px;
    color:rgb(7, 5, 5);
    word-wrap:break-word;
}

.bot .bubble{
    background:#ffffff;
}

.user .bubble{
    background:#10a37f;
}

.input-area{
    background:#40414f;
    padding:15px;
}

.input-box{
    display:flex;
    align-items:center;
    gap:10px;
}

input[type="text"]{
    flex:1;
    padding:12px;
    border:none;
    border-radius:10px;
    outline:none;
    font-size:15px;
}

.file-btn{
    background:#565869;
    color:white;
    padding:10px;
    border-radius:10px;
    cursor:pointer;
}

.send-btn{
    background:#10a37f;
    color:white;
    border:none;
    padding:12px 18px;
    border-radius:10px;
    cursor:pointer;
}

.send-btn:hover{
    background:#0d8f6d;
}

.preview{
    margin-top:10px;
}

.preview img{
    max-width:120px;
    border-radius:10px;
}
</style>
</head>

<body>

<div class="container">

    <div class="header">
        📰 Check News
    </div>

    <div class="chat-box" id="chatBox">

        <div class="message bot">
            <div class="bubble">
                Hello! Paste a news article or upload an image.
            </div>
        </div>

    </div>

    <div class="input-area">

        <div class="input-box">

            <label class="file-btn">
                📎
                <input type="file"
                       id="imageInput"
                       accept="image/*"
                       hidden>
            </label>

            <input type="text"
                   id="messageInput"
                   placeholder="Paste news here...">

            <button class="send-btn"
                    onclick="sendMessage()">
                ➤
            </button>

        </div>

        <div class="preview" id="preview"></div>

    </div>

</div>

<script>

let selectedImage = null;

document.getElementById("imageInput")
.addEventListener("change", function(){

    const file = this.files[0];

    if(file){

        const reader = new FileReader();

        reader.onload = function(e){

            selectedImage = e.target.result;

            document.getElementById("preview").innerHTML =
            `<img src="${selectedImage}">`;
        };

        reader.readAsDataURL(file);
    }
});

function sendMessage(){

    let text =
    document.getElementById("messageInput").value;

    if(text === "" && !selectedImage){
        return;
    }

    let userHtml = `
    <div class="message user">
        <div class="bubble">
            ${text}
            ${selectedImage ?
            `<br><img src="${selectedImage}"
             style="max-width:150px;
             margin-top:10px;
             border-radius:10px;">`
            : ""}
        </div>
    </div>`;

    document.getElementById("chatBox")
    .innerHTML += userHtml;

    setTimeout(function(){

        document.getElementById("chatBox")
        .innerHTML += `
        <div class="message bot">
            <div class="bubble">
                Checking news...
            </div>
        </div>`;

        document.getElementById("chatBox")
        .scrollTop =
        document.getElementById("chatBox")
        .scrollHeight;

    },500);

    document.getElementById("messageInput").value="";
    document.getElementById("preview").innerHTML="";
    selectedImage=null;
}

</script>

</body>
</html>
