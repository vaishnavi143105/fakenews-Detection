<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fake News Detection - Login</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#326bd4,#de06b2);
}

.login-container{
    width:500px;
    background:white;
    padding:80px;
    border-radius:15px;
    box-shadow:0 10px 25px rgba(0,0,0,0.3);
    text-align:center;
}

.login-container h1{
    color:#094195;
    margin-bottom:10px;
}

.login-container p{
    color:#666;
    margin-bottom:25px;
}

.input-group{
    margin-bottom:20px;
    text-align:left;
}

.input-group label{
    display:block;
    margin-bottom:5px;
    font-weight:bold;
}

.input-group input{
    width:100%;
    padding:12px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:16px;
}

.input-group input:focus{
    outline:none;
    border-color:#2a5298;
}

.login-btn{
    width:100%;
    padding:12px;
    border:none;
    background:#4286fb;
    color:white;
    font-size:16px;
    border-radius:8px;
    cursor:pointer;
    transition:0.3s;
}

.login-btn:hover{
    background:#1e3c72;
}

.links{
    margin-top:15px;
}

.links a{
    text-decoration:none;
    color:#2a5298;
    font-size:14px;
}

.links a:hover{
    text-decoration:underline;
}
</style>
</head>

<body>

<div class="login-container">
    <h1>Fake News Detection</h1>
    <p>Login to verify news authenticity</p>
<form method="POST">
    {% csrf_token %}

    <div class="input-group">
        <label>Username</label>
        <input type="text" name="username"
               placeholder="Enter Username" required>
    </div>

    <div class="input-group">
        <label>Password</label>
        <input type="password" name="password"
               placeholder="Enter Password" required>
    </div>

    <button type="submit" class="login-btn">Login</button>
</form>
    
</div>

</body>
</html>
